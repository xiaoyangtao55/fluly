name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Unit tests
        run: >
          ./gradlew
          :app:testDebugUnitTest
          :agent:testDebugUnitTest
          :watchface-core:testDebugUnitTest
          :watchface-runtime:testDebugUnitTest
          :ui-kit:testDebugUnitTest
          :watchface-editor:testDebugUnitTest
          :watchface-store-client:testDebugUnitTest
          :watchface-store:testDebugUnitTest
          :studio:testDebugUnitTest
          --no-daemon --console=plain

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            */build/reports/tests/
            */build/test-results/
          if-no-files-found: ignore

  # push / PR 只测试；手动触发时额外构建并上传两款应用的 APK。
  # 此处 Release 未签名，正式签名发布由下方任务在手动选择 v* 标签时执行。
  build:
    name: Build APKs
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Android SDK platform 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME; runner image changed?"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" > /dev/null
          fi
          if [ ! -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "build-tools;36.0.0" > /dev/null
          fi

      - name: Assemble APKs
        shell: bash
        run: |
          set -o pipefail
          ./gradlew \
            :app:assembleDebug \
            :app:assembleRelease \
            :studio:assembleDebug \
            :studio:assembleRelease \
            --continue --stacktrace --info --no-daemon --console=plain \
            2>&1 | tee "$RUNNER_TEMP/assemble-apks.log"

      - name: Upload build diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            ${{ runner.temp }}/assemble-apks.log
            build/reports/problems/
          if-no-files-found: warn

      - name: Upload APKs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: flue-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            studio/build/outputs/apk/debug/*.apk
            studio/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    name: Release
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    needs: [ test, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FLUE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::FLUE_KEYSTORE_BASE64 is not configured; refusing to publish an unsigned build."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/flue-release.jks"

      - name: Build release APK
        env:
          FLUE_SIGNING_STORE_FILE: ${{ runner.temp }}/flue-release.jks
          FLUE_SIGNING_STORE_PASSWORD: ${{ secrets.FLUE_SIGNING_STORE_PASSWORD }}
          FLUE_SIGNING_KEY_ALIAS: ${{ secrets.FLUE_SIGNING_KEY_ALIAS }}
          FLUE_SIGNING_KEY_PASSWORD: ${{ secrets.FLUE_SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Verify signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK"
          sha256sum "$APK" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flue-release
          path: |
            app/build/outputs/apk/release/*.apk
            SHA256SUMS.txt

      - name: Publish GitHub release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            app/build/outputs/apk/release/*.apk SHA256SUMS.txt \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            || gh release upload "${{ github.ref_name }}" \
                 app/build/outputs/apk/release/*.apk SHA256SUMS.txt --clobber
